spring.application.name=smartcampus

spring.datasource.url=jdbc:postgresql://localhost:5433/smartcampus
spring.datasource.username=smartcampus
spring.datasource.password=smartcampus

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cookie de session : inaccessible au JavaScript (HttpOnly) et limité aux requêtes du site (SameSite)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Domaine e-mail institutionnel accepté pour la connexion
smartcampus.allowed-domain=usms.ma
